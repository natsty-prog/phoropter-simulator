<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פורופטר VT-5C — סימולטור אינטראקטיבי</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', sans-serif;
      color: #e2e8f0;
      overflow: hidden;
      user-select: none;
    }
    #scene {
      perspective: 1400px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: grab;
    }
    #scene:active { cursor: grabbing; }
    #grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(to right, #1e293b 1px, transparent 1px),
        linear-gradient(to bottom, #1e293b 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    #wrap {
      transform-style: preserve-3d;
      will-change: transform;
    }
    header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 18px 24px;
      display: flex; justify-content: space-between; align-items: flex-start;
      z-index: 30; pointer-events: none;
    }
    header > * { pointer-events: auto; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; }
    h1 span.eye { font-size: 1.6rem; }
    .subtitle { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
    #reset-btn {
      background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
      transition: background 0.15s;
    }
    #reset-btn:hover { background: #334155; }
    footer {
      border-top: 1px solid #1e293b;
      background: rgba(15,23,42,0.8);
      padding: 10px; text-align: center;
      font-size: 0.75rem; color: #64748b; z-index: 20;
    }
    /* Tooltip */
    #tip {
      position: fixed; z-index: 100;
      width: 300px;
      background: rgba(15,23,42,0.97);
      border: 1px solid #334155;
      border-left: 4px solid #06b6d4;
      border-radius: 12px;
      padding: 14px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    #tip h3 { font-size: 0.85rem; font-weight: 700; color: #67e8f9; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #1e293b; line-height: 1.3; }
    #tip p { font-size: 0.78rem; color: #94a3b8; line-height: 1.6; direction: rtl; }
    /* SVG hotspot cursor */
    .hs { cursor: help; }
    .hs .hr { opacity: 0; transition: opacity 0.2s; }
    .hs:hover .hr { opacity: 1; }
  </style>
</head>
<body>

<div id="tip">
  <h3 id="tip-title"></h3>
  <p id="tip-desc"></p>
</div>

<header>
  <div>
    <h1><span class="eye">👁</span> פורופטר VT-5C — סימולטור אינטראקטיבי</h1>
    <p class="subtitle">גרור כדי לסובב תלת-ממדית • רחף מעל כל רכיב לתיאורו</p>
  </div>
  <button id="reset-btn">↺ אפס זווית צפייה</button>
</header>

<div id="scene">
  <div id="grid"></div>
  <div id="wrap">
    <svg width="740" height="590" viewBox="0 0 740 590" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Silver gradients -->
        <linearGradient id="sg1" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f2f2f2"/>
          <stop offset="25%" stop-color="#d8d8d8"/>
          <stop offset="65%" stop-color="#a0a0a0"/>
          <stop offset="100%" stop-color="#686868"/>
        </linearGradient>
        <linearGradient id="sg2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b8b8b8"/>
          <stop offset="35%" stop-color="#ebebeb"/>
          <stop offset="65%" stop-color="#b0b0b0"/>
          <stop offset="100%" stop-color="#787878"/>
        </linearGradient>
        <radialGradient id="knob" cx="32%" cy="28%" r="68%">
          <stop offset="0%" stop-color="#f8f8f8"/>
          <stop offset="35%" stop-color="#d0d0d0"/>
          <stop offset="75%" stop-color="#909090"/>
          <stop offset="100%" stop-color="#505050"/>
        </radialGradient>
        <radialGradient id="knobSm" cx="32%" cy="28%" r="68%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="45%" stop-color="#cccccc"/>
          <stop offset="100%" stop-color="#686868"/>
        </radialGradient>
        <radialGradient id="housing" cx="28%" cy="22%" r="78%">
          <stop offset="0%" stop-color="#c8c8c8"/>
          <stop offset="45%" stop-color="#989898"/>
          <stop offset="100%" stop-color="#484848"/>
        </radialGradient>
        <radialGradient id="outerRing" cx="30%" cy="25%" r="70%">
          <stop offset="0%" stop-color="#efefef"/>
          <stop offset="40%" stop-color="#d4d4d4"/>
          <stop offset="80%" stop-color="#a8a8a8"/>
          <stop offset="100%" stop-color="#707070"/>
        </radialGradient>
        <radialGradient id="aperture" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#0a1828"/>
          <stop offset="55%" stop-color="#060e18"/>
          <stop offset="100%" stop-color="#010308"/>
        </radialGradient>
        <radialGradient id="lensRef" cx="38%" cy="32%" r="60%">
          <stop offset="0%" stop-color="#1e40af" stop-opacity="0.5"/>
          <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
        </radialGradient>
        <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
        </filter>
        <filter id="ds2" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
        </filter>
        <radialGradient id="bridgeGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#d8d8d8"/>
          <stop offset="100%" stop-color="#888888"/>
        </radialGradient>
      </defs>

      <!-- ═══════════════════════════════════════════
           TOP MOUNTING ASSEMBLY
      ═══════════════════════════════════════════ -->

      <!-- Vertical rod -->
      <rect x="348" y="15" width="44" height="95" rx="6" fill="url(#sg2)" stroke="#909090" stroke-width="1.2"/>
      <!-- Rod highlight -->
      <rect x="354" y="15" width="8" height="95" rx="3" fill="rgba(255,255,255,0.18)"/>

      <!-- Top horizontal bracket -->
      <g class="hs" data-part="rotatingKnob">
        <rect x="295" y="12" width="150" height="40" rx="10" fill="url(#sg1)" stroke="#aaa" stroke-width="1.5" filter="url(#ds2)"/>
        <rect x="299" y="16" width="60" height="8" rx="3" fill="rgba(255,255,255,0.2)"/>
        <!-- Two top screws/knobs -->
        <circle cx="320" cy="14" r="13" fill="url(#knob)" stroke="#bbb" stroke-width="1.2" filter="url(#ds2)"/>
        <circle cx="320" cy="14" r="7" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.7"/>
        <circle cx="320" cy="14" r="3" fill="#888"/>
        <circle cx="420" cy="14" r="13" fill="url(#knob)" stroke="#bbb" stroke-width="1.2" filter="url(#ds2)"/>
        <circle cx="420" cy="14" r="7" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.7"/>
        <circle cx="420" cy="14" r="3" fill="#888"/>
        <!-- hover -->
        <rect x="293" y="10" width="154" height="44" rx="11" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Fixing knob (right) -->
      <g class="hs" data-part="fixingKnob">
        <rect x="452" y="48" width="55" height="24" rx="6" fill="url(#sg1)" stroke="#aaa" stroke-width="1"/>
        <circle cx="490" cy="43" r="16" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="490" cy="43" r="9" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <circle cx="490" cy="43" r="4" fill="#888"/>
        <rect x="450" y="46" width="59" height="28" rx="7" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Fixed insertion port -->
      <g class="hs" data-part="fixedPort">
        <rect x="333" y="68" width="74" height="22" rx="5" fill="#282828" stroke="#555" stroke-width="1.2"/>
        <rect x="337" y="71" width="66" height="16" rx="3" fill="#1a1a1a" stroke="#444" stroke-width="0.7"/>
        <line x1="348" y1="68" x2="348" y2="90" stroke="#444" stroke-width="0.6"/>
        <line x1="392" y1="68" x2="392" y2="90" stroke="#444" stroke-width="0.6"/>
        <rect x="331" y="66" width="78" height="26" rx="6" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- ═══════════════════════════════════════════
           HORIZONTAL BRIDGE BAR
      ═══════════════════════════════════════════ -->

      <rect x="110" y="128" width="520" height="52" rx="12" fill="url(#sg1)" stroke="#999" stroke-width="1.5" filter="url(#ds)"/>
      <!-- Bridge highlight -->
      <rect x="114" y="132" width="512" height="10" rx="5" fill="rgba(255,255,255,0.15)"/>

      <!-- Locking screw near point rod (left) -->
      <g class="hs" data-part="lockingScrew">
        <rect x="103" y="133" width="32" height="42" rx="7" fill="url(#sg2)" stroke="#aaa" stroke-width="1.2"/>
        <circle cx="119" cy="154" r="12" fill="url(#knob)" stroke="#bbb" stroke-width="1.2"/>
        <circle cx="119" cy="154" r="6" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.6"/>
        <circle cx="119" cy="154" r="2.5" fill="#888"/>
        <rect x="101" y="131" width="36" height="46" rx="8" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Horizontal adjusting knob (left) -->
      <g class="hs" data-part="horizontalKnob">
        <circle cx="158" cy="154" r="20" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="158" cy="154" r="12" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <!-- Notch lines -->
        <line x1="145" y1="154" x2="171" y2="154" stroke="#888" stroke-width="1.2"/>
        <line x1="158" y1="141" x2="158" y2="167" stroke="#888" stroke-width="1.2"/>
        <line x1="148" y1="144" x2="168" y2="164" stroke="#888" stroke-width="0.8"/>
        <line x1="168" y1="144" x2="148" y2="164" stroke="#888" stroke-width="0.8"/>
        <circle cx="158" cy="154" r="5" fill="#848484"/>
        <circle cx="158" cy="154" r="22" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- PD Display Window (Left) -->
      <g class="hs" data-part="pdWindow">
        <rect x="215" y="136" width="48" height="26" rx="4" fill="white" stroke="#909090" stroke-width="1.5"/>
        <rect x="217" y="138" width="44" height="22" rx="3" fill="#f5faff"/>
        <text x="239" y="153" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">64</text>
        <rect x="213" y="134" width="52" height="30" rx="5" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- PD Knob Left -->
      <g class="hs" data-part="pdKnob">
        <circle cx="282" cy="128" r="20" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="282" cy="128" r="12" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <circle cx="282" cy="128" r="5" fill="#888"/>
        <!-- Knurling dots -->
        <circle cx="282" cy="109" r="2" fill="#aaa"/>
        <circle cx="299" cy="116" r="2" fill="#aaa"/>
        <circle cx="301" cy="135" r="2" fill="#aaa"/>
        <circle cx="263" cy="116" r="2" fill="#aaa"/>
        <circle cx="261" cy="135" r="2" fill="#aaa"/>
        <circle cx="282" cy="128" r="22" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- PD Knob Right -->
      <g class="hs" data-part="pdKnob">
        <circle cx="458" cy="128" r="20" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="458" cy="128" r="12" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <circle cx="458" cy="128" r="5" fill="#888"/>
        <circle cx="458" cy="109" r="2" fill="#aaa"/>
        <circle cx="475" cy="116" r="2" fill="#aaa"/>
        <circle cx="477" cy="135" r="2" fill="#aaa"/>
        <circle cx="439" cy="116" r="2" fill="#aaa"/>
        <circle cx="437" cy="135" r="2" fill="#aaa"/>
        <circle cx="458" cy="128" r="22" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Horizontal Bubble -->
      <g class="hs" data-part="horizontalBubble">
        <rect x="455" y="137" width="56" height="24" rx="4" fill="#0f2a0f" stroke="#2d5a2d" stroke-width="1.5"/>
        <rect x="458" y="140" width="50" height="18" rx="3" fill="#081a08"/>
        <rect x="460" y="143" width="46" height="12" rx="6" fill="#1a4a1a" stroke="#287028" stroke-width="0.7"/>
        <!-- Bubble fluid shimmer -->
        <ellipse cx="483" cy="149" rx="10" ry="5" fill="#5af05a" opacity="0.75"/>
        <ellipse cx="481" cy="147" rx="5" ry="2.5" fill="#9aff9a" opacity="0.5"/>
        <!-- Center reference lines -->
        <line x1="480" y1="140" x2="480" y2="161" stroke="#1a5a1a" stroke-width="0.8"/>
        <line x1="486" y1="140" x2="486" y2="161" stroke="#1a5a1a" stroke-width="0.8"/>
        <rect x="453" y="135" width="60" height="28" rx="5" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Horizontal knob right -->
      <g class="hs" data-part="horizontalKnob">
        <circle cx="578" cy="154" r="20" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="578" cy="154" r="12" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <line x1="565" y1="154" x2="591" y2="154" stroke="#888" stroke-width="1.2"/>
        <line x1="578" y1="141" x2="578" y2="167" stroke="#888" stroke-width="1.2"/>
        <circle cx="578" cy="154" r="5" fill="#848484"/>
        <circle cx="578" cy="154" r="22" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Aux lens knob bridge-right -->
      <g class="hs" data-part="auxLensKnob">
        <circle cx="618" cy="154" r="17" fill="url(#knob)" stroke="#bbb" stroke-width="1.5" filter="url(#ds2)"/>
        <circle cx="618" cy="154" r="9" fill="url(#knobSm)" stroke="#ccc" stroke-width="0.8"/>
        <text x="618" y="140" font-family="monospace" font-size="7" fill="#ccc" text-anchor="middle">A</text>
        <text x="632" y="157" font-family="monospace" font-size="7" fill="#ccc" text-anchor="middle">B</text>
        <text x="618" y="170" font-family="monospace" font-size="7" fill="#ccc" text-anchor="middle">C</text>
        <circle cx="618" cy="154" r="19" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- ═══════════════════════════════════════════
           LEFT → CONNECTION STRUTS
      ═══════════════════════════════════════════ -->
      <path d="M 185 178 C 185 210 185 225 185 245" stroke="url(#sg2)" stroke-width="22" stroke-linecap="round" fill="none"/>
      <path d="M 555 178 C 555 210 555 225 555 245" stroke="url(#sg2)" stroke-width="22" stroke-linecap="round" fill="none"/>

      <!-- ═══════════════════════════════════════════
           LEFT EYE HOUSING
      ═══════════════════════════════════════════ -->
      <g id="left-eye" filter="url(#ds)">

        <!-- Spherical Disk (outermost big silver ring) -->
        <g class="hs" data-part="sphericalDisk">
          <!-- Shadow ring -->
          <circle cx="195" cy="355" r="133" fill="#484848" stroke="#333" stroke-width="1"/>
          <!-- Outer silver ring body -->
          <circle cx="195" cy="355" r="130" fill="url(#outerRing)" stroke="#c0c0c0" stroke-width="1.5"/>
          <!-- Inner dark boundary of ring -->
          <circle cx="195" cy="355" r="110" fill="#585858" stroke="#484848" stroke-width="1.5"/>
          <!-- Tick marks on ring (JS will add) -->
          <circle id="L-sph-ticks" cx="195" cy="355" r="120"/>
          <!-- Scale numbers (simplified ring) -->
          <text x="195" y="235" font-family="monospace" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold">0</text>
          <text x="306" y="270" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">+3</text>
          <text x="328" y="355" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">+6</text>
          <text x="306" y="445" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">+9</text>
          <text x="84" y="270" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">−3</text>
          <text x="62" y="355" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">−6</text>
          <text x="84" y="445" font-family="monospace" font-size="9" fill="#1a1a1a" text-anchor="middle">−9</text>
          <!-- Hover -->
          <circle cx="195" cy="355" r="132" fill="none" stroke="#06b6d4" stroke-width="3" class="hr"/>
        </g>

        <!-- Main housing body -->
        <circle cx="195" cy="355" r="108" fill="url(#housing)" stroke="#909090" stroke-width="1.5"/>
        <!-- Housing highlight arc -->
        <path d="M 120 295 A 90 90 0 0 1 270 295" stroke="rgba(255,255,255,0.15)" stroke-width="8" fill="none" stroke-linecap="round"/>

        <!-- Cylinder Axis Dial ring (silver ring around aperture) -->
        <g class="hs" data-part="cylAxisDial">
          <!-- Outer edge of axis ring -->
          <circle cx="195" cy="355" r="88" fill="#cccccc" stroke="#aaa" stroke-width="1.5"/>
          <!-- Inner edge of axis ring -->
          <circle cx="195" cy="355" r="76" fill="#6e6e6e" stroke="#585858" stroke-width="1.2"/>
          <!-- Tick marks -->
          <circle cx="195" cy="355" r="82" fill="none" stroke="#444" stroke-width="0.8" stroke-dasharray="1.8 4"/>
          <!-- Degree markers -->
          <text x="195" y="272" font-family="monospace" font-size="8" fill="#e0e0e0" text-anchor="middle">180</text>
          <text x="280" y="358" font-family="monospace" font-size="8" fill="#e0e0e0" text-anchor="middle">90</text>
          <text x="195" y="444" font-family="monospace" font-size="8" fill="#e0e0e0" text-anchor="middle">0</text>
          <text x="110" y="358" font-family="monospace" font-size="8" fill="#e0e0e0" text-anchor="middle">270</text>
          <!-- Indicator line -->
          <line x1="195" y1="268" x2="195" y2="278" stroke="#ff6060" stroke-width="2.5" stroke-linecap="round"/>
          <!-- Hover -->
          <circle cx="195" cy="355" r="89" fill="none" stroke="#06b6d4" stroke-width="3" class="hr"/>
        </g>

        <!-- Dark inner ring (lens housing) -->
        <circle cx="195" cy="355" r="74" fill="#242424" stroke="#404040" stroke-width="1.5"/>

        <!-- Main aperture (viewing lens) -->
        <g class="hs" data-part="aperture">
          <circle cx="195" cy="355" r="57" fill="url(#aperture)"/>
          <!-- Lens reflection -->
          <ellipse cx="176" cy="336" rx="20" ry="13" fill="url(#lensRef)" transform="rotate(-20 176 336)"/>
          <ellipse cx="210" cy="372" rx="10" ry="6" fill="#0a1a40" opacity="0.3"/>
          <!-- Rim -->
          <circle cx="195" cy="355" r="57" fill="none" stroke="#1e1e1e" stroke-width="2.5"/>
          <!-- Crosshair faint -->
          <line x1="170" y1="355" x2="220" y2="355" stroke="#0d2d0d" stroke-width="0.6" opacity="0.6"/>
          <line x1="195" y1="330" x2="195" y2="380" stroke="#0d2d0d" stroke-width="0.6" opacity="0.6"/>
          <circle cx="195" cy="355" r="58" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
        </g>

      </g><!-- /left-eye -->

      <!-- Left Auxiliary Lens Dial (swing-arm, front) -->
      <g class="hs" data-part="auxLensDial">
        <!-- Arm -->
        <line x1="215" y1="270" x2="278" y2="296" stroke="url(#sg1)" stroke-width="8" stroke-linecap="round"/>
        <!-- Dial body -->
        <circle cx="294" cy="290" r="37" fill="url(#outerRing)" stroke="#b0b0b0" stroke-width="2" filter="url(#ds2)"/>
        <circle cx="294" cy="290" r="30" fill="#b8b8b8" stroke="#aaa" stroke-width="1.2"/>
        <circle cx="294" cy="290" r="17" fill="url(#aperture)"/>
        <!-- Mini ticks -->
        <circle cx="294" cy="290" r="23" fill="none" stroke="#666" stroke-width="0.8" stroke-dasharray="2 5"/>
        <!-- Selection lever -->
        <line x1="294" y1="253" x2="292" y2="230" stroke="url(#sg1)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="292" cy="224" r="10" fill="url(#knob)" stroke="#bbb" stroke-width="1.2"/>
        <circle cx="292" cy="224" r="5" fill="url(#knobSm)"/>
        <!-- Hover -->
        <circle cx="294" cy="290" r="39" fill="none" stroke="#06b6d4" stroke-width="2.5" class="hr"/>
      </g>

      <!-- Left Aux Lens Knob (on housing side) -->
      <g class="hs" data-part="auxLensKnob">

// ═══════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════
const tip = document.getElementById('tip');
const tipTitle = document.getElementById('tip-title');
const tipDesc = document.getElementById('tip-desc');
let tipTimer;

document.querySelectorAll('.hs').forEach(el => {
  el.addEventListener('mouseenter', () => {
    const p = PARTS[el.dataset.part];
    if (!p) return;
    const ring = el.querySelector('.hr');
    if (ring) ring.setAttribute('opacity', '0.9');
    tipTitle.textContent = p.title;
    tipDesc.textContent = p.desc;
    tip.style.borderLeftColor = p.color;
    tip.style.opacity = '1';
    clearTimeout(tipTimer);
  });
  el.addEventListener('mouseleave', () => {
    const ring = el.querySelector('.hr');
    if (ring) ring.setAttribute('opacity', '0');
    tipTimer = setTimeout(() => { tip.style.opacity = '0'; }, 180);
  });
});

document.addEventListener('mousemove', e => {
  let x = e.clientX + 22, y = e.clientY + 18;
  if (x + 310 > window.innerWidth) x = e.clientX - 318;
  if (y + 220 > window.innerHeight) y = e.clientY - 170;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});

// ═══════════════════════════════════════════
// 3D DRAG ROTATION
// ═══════════════════════════════════════════
const scene = document.getElementById('scene');
const wrap = document.getElementById('wrap');
let rotX = 0, rotY = 0, dragging = false, sx = 0, sy = 0;

function applyTransform(animate) {
  if (animate) wrap.style.transition = 'transform 0.4s cubic-bezier(.25,.8,.25,1)';
  else wrap.style.transition = 'none';
  wrap.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  if (animate) setTimeout(() => wrap.style.transition = 'none', 420);
}

scene.addEventListener('pointerdown', e => {
  if (e.target.closest('.hs')) return;
  dragging = true;
  sx = e.clientX - rotY;
  sy = e.clientY + rotX;
  scene.setPointerCapture(e.pointerId);
});

scene.addEventListener('pointermove', e => {
  if (!dragging) return;
  rotY = Math.max(-55, Math.min(55, e.clientX - sx));
  rotX = Math.max(-35, Math.min(35, sy - e.clientY));
  applyTransform(false);
});

scene.addEventListener('pointerup', () => { dragging = false; });

document.getElementById('reset-btn').addEventListener('click', e => {
  e.stopPropagation();
  rotX = 0; rotY = 0;
  applyTransform(true);
});

// ═══════════════════════════════════════════
// DRAW TICK MARKS ON RINGS (JS)
// ═══════════════════════════════════════════
function addTicks(circleId, cx, cy, r, count, len, color, sw) {
  const el = document.getElementById(circleId);
  if (!el) return;
  const parent = el.parentNode;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(angle);
    const y1 = cy + r * Math.sin(angle);
    const x2 = cx + (r + len) * Math.cos(angle);
    const y2 = cy + (r + len) * Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', sw);
    parent.insertBefore(line, el);
  }
  el.remove();
}

addTicks('L-sph-ticks', 195, 355, 112, 72, 6, '#555', '1');
addTicks('R-sph-ticks', 545, 355, 112, 72, 6, '#555', '1');
