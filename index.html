<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פורופטר VT-5C — תלת ממד</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d1520;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#e2e8f0}
    canvas{display:block}
    #ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
        align-items:flex-start;padding:16px 20px;pointer-events:none;z-index:10}
    #ui>*{pointer-events:auto}
    h1{font-size:1.3rem;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
    .sub{font-size:.72rem;color:#475569;margin-top:4px}
    .btns{display:flex;gap:8px;align-items:center}
    .btn{background:rgba(15,23,42,.88);border:1px solid #334155;color:#e2e8f0;
         padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.78rem;
         backdrop-filter:blur(8px);transition:background .15s}
    .btn:hover{background:rgba(51,65,85,.9)}
    .btn.active{background:rgba(6,182,212,.2);border-color:#06b6d4;color:#67e8f9}
    #tip{position:fixed;z-index:20;width:265px;background:rgba(10,15,28,.96);
         border:1px solid #334155;border-left:3px solid #06b6d4;border-radius:10px;
         padding:11px 14px;pointer-events:none;opacity:0;transition:opacity .15s;
         backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.6)}
    #tip h3{color:#67e8f9;font-size:.82rem;margin-bottom:6px;padding-bottom:6px;
            border-bottom:1px solid #1e293b}
    #tip p{color:#94a3b8;font-size:.75rem;line-height:1.55;direction:rtl}
    #footer{position:fixed;bottom:0;left:0;right:0;text-align:center;padding:9px;
            font-size:.7rem;color:#334155;background:rgba(13,21,32,.7);
            border-top:1px solid #1e293b;backdrop-filter:blur(4px)}
    #loading{position:fixed;inset:0;background:#0d1520;display:flex;flex-direction:column;
             align-items:center;justify-content:center;z-index:100;transition:opacity .6s}
    .spin{width:44px;height:44px;border:3px solid #1e293b;border-top-color:#06b6d4;
          border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
    @keyframes sp{to{transform:rotate(360deg)}}
    #loading p{color:#475569;font-size:.8rem}
  </style>
</head>
<body>
<div id="loading"><div class="spin"></div><p>טוען מודל תלת-ממד…</p></div>

<div id="ui">
  <div>
    <h1>👁 פורופטר VT-5C — מודל תלת-ממד</h1>
    <p class="sub">גרור לסיבוב 360° • גלגל לזום • רחף מעל רכיב לפרטים</p>
  </div>
  <div class="btns">
    <button class="btn" id="bFront">⬜ חזית</button>
    <button class="btn" id="bSide">◧ צד</button>
    <button class="btn" id="bTop">⬆ עליון</button>
    <button class="btn" id="bIso">⟲ איזומטרי</button>
    <button class="btn" id="bAuto">▶ סיבוב אוטומטי</button>
  </div>
</div>

<div id="tip"><h3 id="tTitle"></h3><p id="tDesc"></p></div>
<div id="footer">גרור לסיבוב מלא 360° בכל הכיוונים • גלגל לזום • רחף מעל חלקי המכשיר ללמוד על תפקידם</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ── RENDERER ──────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── SCENE ─────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1520);
scene.fog = new THREE.FogExp2(0x0d1520, 0.032);

// ── CAMERA ────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
camera.position.set(2.5, 1.2, 6.0);

// ── ENVIRONMENT (metallic reflections) ───────────
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ── LIGHTS ────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const sun = new THREE.DirectionalLight(0xfff5e0, 2.8);
sun.position.set(5, 8, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8899cc, 0.7);
fill.position.set(-5, 2, -4); scene.add(fill);

const rim = new THREE.DirectionalLight(0xaaccff, 0.4);
rim.position.set(0, -4, -5); scene.add(rim);

const pt = new THREE.PointLight(0xffffff, 0.6, 18); pt.position.set(0, 5, 3); scene.add(pt);

// ── CONTROLS ──────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 2.2;
controls.maxDistance = 18;
controls.target.set(0, 0.1, 0);
controls.update();

// ── MATERIALS ─────────────────────────────────────
const M = {
  silver:      new THREE.MeshStandardMaterial({ color:0xd6d6d6, metalness:.94, roughness:.10 }),
  silverBrt:   new THREE.MeshStandardMaterial({ color:0xeeeeee, metalness:.90, roughness:.06 }),
  silverMid:   new THREE.MeshStandardMaterial({ color:0xb0b0b0, metalness:.88, roughness:.18 }),
  silverDark:  new THREE.MeshStandardMaterial({ color:0x909090, metalness:.85, roughness:.24 }),
  housing:     new THREE.MeshStandardMaterial({ color:0x888888, metalness:.82, roughness:.22 }),
  dark:        new THREE.MeshStandardMaterial({ color:0x1c1c1c, metalness:.45, roughness:.55 }),
  aperture:    new THREE.MeshStandardMaterial({ color:0x020508, metalness:.05, roughness:.02 }),
  glass:       new THREE.MeshStandardMaterial({ color:0x081830, metalness:.08, roughness:.0, transparent:true, opacity:.55 }),
  green:       new THREE.MeshStandardMaterial({ color:0x22cc55, emissive:new THREE.Color(0x0a4420), roughness:.25 }),
  white:       new THREE.MeshStandardMaterial({ color:0xf0f0f0, metalness:.0,  roughness:.6  }),
  red:         new THREE.MeshStandardMaterial({ color:0xff2020, emissive:new THREE.Color(0x660000), roughness:.3 }),
};

// ── HELPERS ───────────────────────────────────────
function mesh(geo, mat, parent, pos=[0,0,0], rot=[0,0,0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}

function cylinderBetween(p1, p2, r, mat, parent) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(.5);
  const m = mesh(new THREE.CylinderGeometry(r, r, len, 14), mat, parent);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}

// Ring of small boxes (tick marks on face, in XY plane)
function faceTicks(cx, cy, cz, r, n, h, w, d, mat, parent) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const im = new THREE.InstancedMesh(geo, mat, n);
  im.castShadow = false;
  const mx = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const a = (i/n) * Math.PI * 2;
    mx.makeRotationZ(a);
    mx.setPosition(cx + r*Math.cos(a - Math.PI/2), cy + r*Math.sin(a - Math.PI/2), cz);
    im.setMatrixAt(i, mx);
  }
  im.instanceMatrix.needsUpdate = true;
  parent.add(im);
}

// Ring of knurling ticks around a cylinder (XZ plane)
function cylTicks(cx, cy, cz, r, n, h, mat, parent) {
  const geo = new THREE.BoxGeometry(.012, h, .025);
  const im = new THREE.InstancedMesh(geo, mat, n);
  im.castShadow = false;
  const mx = new THREE.Matrix4(), rot = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const a = (i/n) * Math.PI * 2;
    rot.makeRotationY(a);
    mx.copy(rot);
    mx.setPosition(cx + r*Math.cos(a), cy, cz + r*Math.sin(a));
    im.setMatrixAt(i, mx);
  }
  im.instanceMatrix.needsUpdate = true;
  parent.add(im);
}

// ── PART INFO ─────────────────────────────────────
const INFO = {
  sphRing:  { t:'Spherical Disk — חוגת ה-SPH', d:'הטבעת הגדולה החיצונית. מכילה עדשות ספיריות בטווח −20 עד +20 דיופטר בצעדים של 0.25Δ לתיקון קוצר ראייה ורוחק ראייה.', c:'#fb923c' },
  axisRing: { t:'Cylinder Axis Dial — חוגת הציר', d:'הטבעת הכסופה הפנימית. מסמנת את ציר הצילינדר לתיקון אסטיגמציה, בטווח 0°–180°. הקו האדום הוא הסמן הקבוע.', c:'#fb7185' },
  aperture: { t:'Viewing Aperture — פתח הראייה', d:'הפתח האפל שדרכו המטופל מסתכל בלוח הבדיקה. בתוכו מסתובבות כל העדשות השונות. קוטר ~28 מ"מ.', c:'#06b6d4' },
  housing:  { t:'Main Housing — גוף המכשיר', d:'גוף האלומיניום הראשי המחזיק את כל מנגנוני העדשות. מדויק עד מיקרון אחד כדי לאפשר מדידות אופטיות אמינות.', c:'#94a3b8' },
  cylKnob:  { t:'Cylinder Diopter Knob — כפתור צילינדר', d:'כפתור הצילינדר התחתון. מכוון עוצמת הצילינדר לתיקון אסטיגמציה, 0 עד −6 דיופטר בצעדים של 0.25Δ.', c:'#f87171' },
  auxDial:  { t:'Auxiliary Lens Dial — חוגת עדשות עזר', d:'חוגה סיבובית המכילה עדשות עזר: JCC לכיוון ציר, פינהול, פריזמות, פולארויד, ועדשות מיוחדות לבדיקות ייעודיות.', c:'#a78bfa' },
  pdKnob:   { t:'PD Knob — כפתור מרחק אישונים', d:'מכוון את המרחק בין העדשות לפי ה-PD (Pupil Distance) של המטופל. טווח טיפוסי: 54–74 מ"מ.', c:'#818cf8' },
  bridge:   { t:'Bridge Bar — זרוע הגשר', d:'הקשר האופקי המחבר בין שתי מערכות הראייה. מכיל כפתורי PD, בועת הפילוס ומנגנוני הכיוון האופקי.', c:'#60a5fa' },
  bubble:   { t:'Horizontal Bubble — בועת פילוס', d:'חיוני: הפורופטר חייב מפולס לחלוטין. הטיה של 2–3° גורמת לשגיאות חמורות במדידת ציר אסטיגמציה.', c:'#10b981' },
  topMount: { t:'Mounting Bracket — זרוע הנשיאה', d:'מחבר את הפורופטר לכיסא הבדיקה. כפתורי הנעילה מאפשרים קיבוע מדויק בגובה ובזווית.', c:'#e2e8f0' },
  prism:    { t:'Prism Knob — כפתור פריזמה (Δ)', d:'פריזמות משמשות לאבחון וטיפול בהטיות עיניים, פוריה וסטרביזמוס. מחושב בפריזם-דיופטר (Δ).', c:'#6366f1' },
  auxKnob:  { t:'Aux Lens Knob — כפתור עדשות עזר', d:'בוחר עדשת עזר: OC (כיסוי עין), PL (שקוף), PH (פינהול), R (פריזמה), וכו\'.', c:'#c084fc' },
};

// ── BUILD EYE UNIT ────────────────────────────────
function buildEye(side, g) {
  const sx = side === 'L' ? -0.92 : 0.92;
  const out = side === 'L' ? -1 : 1; // outward direction

  // Housing cylinder (axis along Z)
  const h = mesh(new THREE.CylinderGeometry(.88,.88,.78,80), M.housing, g,
    [sx, 0, -.04], [Math.PI/2,0,0]);
  h.userData.part = 'housing';

  // Housing back cap
  mesh(new THREE.CircleGeometry(.88,64), M.dark, g, [sx,0,-.43]);

  // Back rim ring
  mesh(new THREE.TorusGeometry(.88,.03,12,64), M.dark, g, [sx,0,-.44]);

  // ── SPH OUTER RING ──
  const sph = mesh(new THREE.TorusGeometry(1.07,.145,30,120), M.silver, g, [sx,0,.24]);
  sph.userData.part = 'sphRing';

  const sphFace = mesh(new THREE.RingGeometry(.925,1.215,120), M.silverBrt, g, [sx,0,.39]);
  sphFace.userData.part = 'sphRing';

  // SPH tick marks on front face
  faceTicks(sx,0,.40, 1.07, 80, .048,.011,.10, M.silverDark, g);   // minor ticks
  faceTicks(sx,0,.40, 1.07, 20, .080,.020,.12, M.dark,       g);   // major ticks

  // Housing front face (covers inner part of SPH ring visually)
  mesh(new THREE.RingGeometry(0,.925,80), M.housing, g, [sx,0,.385]);

  // ── AXIS RING ──
  const ax = mesh(new THREE.TorusGeometry(.715,.10,24,90), M.silverBrt, g, [sx,0,.35]);
  ax.userData.part = 'axisRing';

  const axFace = mesh(new THREE.RingGeometry(.615,.815,90), M.silver, g, [sx,0,.395]);
  axFace.userData.part = 'axisRing';

  faceTicks(sx,0,.40, .715, 90, .030,.007,.08, M.silverDark, g);

  // Axis indicator (red) at top
  const ind = mesh(new THREE.CylinderGeometry(.016,.016,.08,8), M.red, g, [sx,.72,.40]);
  ind.userData.part = 'axisRing';
  mesh(new THREE.SphereGeometry(.025,8,8), M.red, g, [sx,.72,.45]);

  // Cover inner of axis ring
  mesh(new THREE.RingGeometry(0,.615,64), M.housing, g, [sx,0,.395]);

  // ── DARK INNER RING ──
  mesh(new THREE.TorusGeometry(.575,.07,14,60), M.dark, g, [sx,0,.36]);
  mesh(new THREE.RingGeometry(0,.575,60), M.dark, g, [sx,0,.398]);

  // ── APERTURE ──
  const ap = mesh(new THREE.CircleGeometry(.505,80), M.aperture, g, [sx,0,.41]);
  ap.userData.part = 'aperture';

  const gl = mesh(new THREE.CircleGeometry(.44,80), M.glass, g, [sx,0,.415]);
  gl.userData.part = 'aperture';

  // Lens highlight
  const hlMat = new THREE.MeshStandardMaterial({
    color:0x2244bb, emissive:new THREE.Color(0x112266),
    emissiveIntensity:.18, transparent:true, opacity:.22
  });
  const hl = new THREE.Mesh(new THREE.CircleGeometry(.22,32), hlMat);
  hl.scale.set(1.7,1,1); hl.position.set(sx - out*.08, .10, .425);
  g.add(hl);

  // ── AUX LENS DIAL (swing-arm) ──
  const asx = sx + out * .60, asy = .30;
  cylinderBetween(
    new THREE.Vector3(sx + out*.20, .58, .38),
    new THREE.Vector3(asx, asy, .38), .024, M.silver, g
  );
  const auxD = mesh(new THREE.TorusGeometry(.255,.065,18,60), M.silver, g, [asx,asy,.38]);
  auxD.userData.part = 'auxDial';
  mesh(new THREE.RingGeometry(0,.19,48), M.housing, g, [asx,asy,.445]);
  mesh(new THREE.CircleGeometry(.155,48), M.aperture, g, [asx,asy,.45]);
  // Aux lever
  mesh(new THREE.CylinderGeometry(.035,.026,.14,12), M.silver, g, [asx - out*.02,.56,.43]);
  mesh(new THREE.SphereGeometry(.048,12,12), M.silverBrt, g, [asx - out*.02,.64,.43]);

  // ── AUX SELECTION KNOB (outer side) ──
  const auxK = mesh(new THREE.CylinderGeometry(.13,.115,.15,28), M.silver, g,
    [sx + out*1.13, .48,.03], [0,0,Math.PI/2]);
  auxK.userData.part = 'auxKnob';
  mesh(new THREE.CylinderGeometry(.09,.09,.022,22), M.silverBrt, g,
    [sx + out*1.215, .48,.03], [0,0,Math.PI/2]);
  cylTicks(sx + out*1.13, .48, .03, .13, 20, .15, M.silverDark, g);

  // ── PRISM KNOB (inner, on front face) ──
  const pr = mesh(new THREE.CylinderGeometry(.11,.095,.10,20), M.silver, g,
    [sx - out*.54, .00,.44], [Math.PI/2,0,0]);
  pr.userData.part = 'prism';

  // ── SPH DISPLAY WINDOW ──
  mesh(new THREE.BoxGeometry(.24,.13,.04), M.white, g, [sx + out*1.12, -.03,.18]);

  // ── CYL DIOPTER KNOB (bottom) ──
  const ck = mesh(new THREE.CylinderGeometry(.175,.158,.24,36), M.silver, g, [sx,-1.08,.22]);
  ck.userData.part = 'cylKnob';
  cylTicks(sx, -1.08, .22, .175, 28, .24, M.silverDark, g);
  mesh(new THREE.CylinderGeometry(.115,.115,.022,24), M.silverBrt, g, [sx,-.96,.22]);
  // Neck
  mesh(new THREE.CylinderGeometry(.08,.08,.18,16), M.housing, g, [sx,-.95,.22]);

  // ── AXIS DISPLAY WINDOW ──
  mesh(new THREE.BoxGeometry(.24,.11,.034), M.white, g, [sx + out*.50,-1.00,.30]);
}

// ── BUILD BRIDGE ──────────────────────────────────
function buildBridge(g) {
  // Main bar
  const br = mesh(new THREE.BoxGeometry(3.42,.42,.30), M.housing, g, [0,1.38,0]);
  br.userData.part = 'bridge';
  // Highlight strips
  mesh(new THREE.BoxGeometry(3.40,.055,.022), M.silver, g, [0,1.57,.16]);
  mesh(new THREE.BoxGeometry(3.40,.055,.022), M.silver, g, [0,1.19,.16]);
  // End caps
  [-1.70,1.70].forEach(x => mesh(new THREE.BoxGeometry(.055,.42,.022), M.silver, g, [x,1.38,.16]));

  // PD knobs (top)
  [-0.58,0.58].forEach(x => {
    const pk = mesh(new THREE.CylinderGeometry(.10,.090,.22,26), M.silver, g, [x,1.62,.05]);
    pk.userData.part = 'pdKnob';
    mesh(new THREE.CylinderGeometry(.075,.075,.022,22), M.silverBrt, g, [x,1.74,.05]);
    cylTicks(x,1.62,.05,.10,16,.22,M.silverDark,g);
  });

  // PD display windows
  [-0.20,0.20].forEach(x => mesh(new THREE.BoxGeometry(.24,.11,.022), M.white, g, [x,1.38,.16]));

  // Horizontal adjusting knobs
  [-1.63,1.63].forEach(x => {
    mesh(new THREE.CylinderGeometry(.115,.10,.12,24), M.silver, g, [x,1.38,.06]);
    cylTicks(x,1.38,.06,.116,12,.12,M.silverDark,g);
  });

  // Bubble level
  const bb = mesh(new THREE.BoxGeometry(.34,.13,.05),
    new THREE.MeshStandardMaterial({color:0x091a09,roughness:.5,metalness:.1}),
    g, [.60,1.38,.165]);
  bb.userData.part = 'bubble';
  mesh(new THREE.BoxGeometry(.30,.09,.018),
    new THREE.MeshStandardMaterial({color:0x00cc44,emissive:new THREE.Color(0x004411),roughness:.2,transparent:true,opacity:.85}),
    g, [.60,1.38,.188]);
  mesh(new THREE.SphereGeometry(.028,12,12), M.green, g, [.60,1.38,.21]);

  // Locking screw (left)
  mesh(new THREE.BoxGeometry(.19,.32,.22), M.silver, g, [-1.85,1.38,0]);
  mesh(new THREE.CylinderGeometry(.08,.07,.10,16), M.silver, g, [-1.97,1.38,0],[0,0,Math.PI/2]);
}

// ── BUILD TOP MOUNT ───────────────────────────────
function buildTop(g) {
  // Vertical rod
  mesh(new THREE.CylinderGeometry(.092,.092,.92,18), M.silver, g, [0,2.12,.0]);
  mesh(new THREE.BoxGeometry(.04,.90,.04), M.dark, g, [0,2.12,.09]);

  // Bracket
  const bk = mesh(new THREE.BoxGeometry(.92,.32,.30), M.silver, g, [0,2.70,.0]);
  bk.userData.part = 'topMount';
  // Bracket detail
  mesh(new THREE.BoxGeometry(.90,.055,.022), M.silverBrt, g, [0,2.845,.16]);

  // Two top locking knobs
  [-0.28,0.28].forEach(x => {
    mesh(new THREE.CylinderGeometry(.092,.092,.18,22), M.silver, g, [x,2.88,.0]);
    mesh(new THREE.CylinderGeometry(.07,.07,.022,18), M.silverBrt, g, [x,2.98,.0]);
    cylTicks(x,2.88,.0,.092,10,.18,M.silverDark,g);
  });

  // Right fixing knob
  mesh(new THREE.CylinderGeometry(.10,.09,.10,20), M.silver, g, [.54,2.70,.0],[0,0,Math.PI/2]);
  mesh(new THREE.CylinderGeometry(.07,.07,.022,16), M.silverBrt, g, [.605,2.70,.0],[0,0,Math.PI/2]);

  // Insertion port
  mesh(new THREE.BoxGeometry(.54,.17,.24),
    new THREE.MeshStandardMaterial({color:0x1a1a1a,metalness:.5,roughness:.4}),
    g, [0,2.44,.0]);
}

// ── BUILD CONNECTORS ──────────────────────────────
function buildConnectors(g) {
  // Angled arms from bridge to eye housings
  [[-0.92,-1],[ 0.92, 1]].forEach(([x, side]) => {
    // Main curved connector
    cylinderBetween(
      new THREE.Vector3(x, .88, .05),
      new THREE.Vector3(x * .82, 1.17, .05),
      .095, M.silverMid, g
    );
    // Junction sphere at bridge
    mesh(new THREE.SphereGeometry(.118,18,18), M.silver, g, [x*.82, 1.17,.05]);
    // Junction sphere at housing
    mesh(new THREE.SphereGeometry(.118,18,18), M.silver, g, [x, .88, .05]);
    // Short vertical stem into bridge bottom
    cylinderBetween(
      new THREE.Vector3(x*.82, 1.17, .05),
      new THREE.Vector3(x*.82, 1.38-.21, .05),
      .09, M.silverMid, g
    );
  });
}

// ── BUILD FOREHEAD REST ───────────────────────────
function buildForehead(g) {
  mesh(new THREE.BoxGeometry(.60,.10,.06), M.silver, g, [0,-1.32,.28]);
  mesh(new THREE.CylinderGeometry(.088,.077,.13,18), M.silver, g, [0,-1.40,.28]);
  mesh(new THREE.CylinderGeometry(.065,.065,.022,16), M.silverBrt, g, [0,-1.47,.28]);
}

// ── GROUND ────────────────────────────────────────
const ground = mesh(
  new THREE.PlaneGeometry(30,30),
  new THREE.MeshStandardMaterial({color:0x080e18,roughness:1,metalness:0}),
  scene, [0,-2.8,0], [-Math.PI/2,0,0]
);
ground.receiveShadow = true;

// ── ASSEMBLE ──────────────────────────────────────
const root = new THREE.Group();
scene.add(root);

buildEye('L', root);
buildEye('R', root);
buildBridge(root);
buildTop(root);
buildConnectors(root);
buildForehead(root);

// Collect interactive meshes
const hitMeshes = [];
root.traverse(o => { if (o.isMesh && o.userData.part) hitMeshes.push(o); });

// ── TOOLTIP ───────────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
const tTitle = document.getElementById('tTitle');
const tDesc = document.getElementById('tDesc');
let tipTimer, lastPart = null;

addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  let lx = e.clientX + 22, ly = e.clientY + 16;
  if (lx + 275 > innerWidth) lx = e.clientX - 280;
  if (ly + 155 > innerHeight) ly = e.clientY - 140;
  tip.style.left = lx+'px'; tip.style.top = ly+'px';

  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(hitMeshes);
  if (hits.length) {
    const p = hits[0].object.userData.part;
    if (p && INFO[p]) {
      tTitle.textContent = INFO[p].t;
      tDesc.textContent = INFO[p].d;
      tip.style.borderLeftColor = INFO[p].c;
      tip.style.opacity = '1';
      document.body.style.cursor = 'help';
      clearTimeout(tipTimer); lastPart = p; return;
    }
  }
  if (lastPart) { tipTimer = setTimeout(()=>{ tip.style.opacity='0'; }, 200); lastPart=null; }
  document.body.style.cursor = 'default';
});

// ── CAMERA PRESETS ────────────────────────────────
function flyTo(px, py, pz, tx=0, ty=.1, tz=0, ms=900) {
  const sp = camera.position.clone(), st = controls.target.clone();
  const ep = new THREE.Vector3(px,py,pz), et = new THREE.Vector3(tx,ty,tz);
  const t0 = performance.now();
  (function step(now) {
    const raw = Math.min((now-t0)/ms, 1);
    const t = raw<.5 ? 2*raw*raw : -1+(4-2*raw)*raw;
    camera.position.lerpVectors(sp, ep, t);
    controls.target.lerpVectors(st, et, t);
    controls.update();
    if (raw < 1) requestAnimationFrame(step);
  })(t0);
}

document.getElementById('bFront').onclick = () => flyTo(0,.3,7.0);
document.getElementById('bSide').onclick  = () => flyTo(7.0,.2,0);
document.getElementById('bTop').onclick   = () => flyTo(0,7.5,.8, 0,0,0);
document.getElementById('bIso').onclick   = () => flyTo(3.0,1.8,5.5);

// Auto-rotate toggle
let autoRot = false;
const bAuto = document.getElementById('bAuto');
bAuto.onclick = () => { autoRot = !autoRot; bAuto.classList.toggle('active', autoRot); };
controls.addEventListener('start', () => { if(autoRot){ autoRot=false; bAuto.classList.remove('active'); } });

// ── RESIZE ────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── ANIMATE ───────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  if (autoRot) root.rotation.y += .005;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Hide loader
setTimeout(() => {
  const l = document.getElementById('loading');
  l.style.opacity = '0';
  setTimeout(() => l.remove(), 650);
}, 300);
</script>
